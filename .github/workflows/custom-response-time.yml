name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    environment: status
    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPPTIME_MANAGER_ID }}
          private-key: ${{ secrets.UPPTIME_MANAGER_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.create_token.outputs.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@e9a818d8e5c4285d0f8b28e78afbaac7b7dd36fa # v1.43.3
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.create_token.outputs.token }}
          # SECRETS_CONTEXT: ${{ toJson(secrets) }}
